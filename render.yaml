# Exported from https://render.com/docs/blueprint-spec
services:
  - type: web
    name: african-push-dashboard
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm run install:all && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
